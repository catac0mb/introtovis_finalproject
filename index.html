<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Hinge Analytics</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <h1>Unhinged Data Analysis</h1>
  <p><a href="process_book.html">Process Book</a></p>


  <h2>Interactions per month</h2>
  <p>
    <span class="key" style="background: #eb6834"></span> Liked
    <span class="key" style="background: #2a78d6"></span> Skipped
    <span class="key" style="background: #1baf7a"></span> Blocked
  </p>
  <div id="bar-chart"></div>


  <h2>Match Analytics</h2>
  <p>Shorter line = flirtier chat</p>

  <div class="graph-area">
    <div class="filters">
      <h3>Month</h3>
      // months hardcoded
      <label><input type="checkbox" name="month" value="2026-07" checked> Jul 2026</label>
      <label><input type="checkbox" name="month" value="2026-08" checked> Aug 2026</label>

      <h3>Sentiment</h3>
      <label><input type="checkbox" name="sentiment" value="Flirty" checked>
        <span class="key" style="background: #e50095"></span> Flirty</label>
      <label><input type="checkbox" name="sentiment" value="Neutral" checked>
        <span class="key" style="background: #9a9893"></span> Neutral</label>
      <label><input type="checkbox" name="sentiment" value="Cold" checked>
        <span class="key" style="background: #2a78d6"></span> Cold</label>
    </div>

    <div id="network-graph"></div>
  </div>

<!-- Load JS libraries -->
  <script src="js/d3.min.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="js/sentiment.js"></script>
  <script src="js/data_loading.js"></script>
  <script src="js/bar_chart.js"></script>
  <script src="js/network_graph.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
